<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080e1a" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <title>Dogfight v1.0.0</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #05070d;
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      #ui-root {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }

      .lobby {
        pointer-events: auto;
        box-sizing: border-box;
        width: min(540px, calc(100vw - 32px));
        max-height: calc(100vh - 32px);
        overflow: auto;
        padding: 24px;
        border: 1px solid rgba(95, 215, 255, 0.35);
        border-radius: 14px;
        background: rgba(8, 14, 26, 0.9);
        color: #dbe9ff;
        font:
          14px ui-monospace,
          Menlo,
          Consolas,
          monospace;
      }

      .lobby[hidden],
      .lobby__error[hidden] {
        display: none;
      }

      .lobby__title {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0.08em;
        text-align: center;
      }

      .lobby__subtitle {
        margin: 6px 0 18px;
        text-align: center;
        color: rgba(190, 215, 255, 0.65);
      }

      .lobby__label {
        display: block;
        margin-bottom: 14px;
        color: rgba(190, 215, 255, 0.75);
      }

      .lobby__input {
        box-sizing: border-box;
        display: block;
        width: 100%;
        margin-top: 6px;
        padding: 10px 12px;
        border: 1px solid rgba(95, 215, 255, 0.4);
        border-radius: 8px;
        background: rgba(5, 12, 22, 0.9);
        color: #f2f8ff;
        font: inherit;
      }

      .lobby__input:focus-visible,
      .lobby__room:focus-visible,
      .lobby__button:focus-visible {
        outline: 2px solid #5fd7ff;
        outline-offset: 2px;
      }

      .lobby__rooms {
        display: grid;
        gap: 8px;
        margin: 0 0 12px;
        padding: 0;
        list-style: none;
      }

      .lobby__room {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 2px 12px;
        padding: 10px 12px;
        border: 1px solid rgba(190, 215, 255, 0.2);
        border-radius: 10px;
        background: rgba(15, 26, 44, 0.7);
        cursor: pointer;
      }

      .lobby__room:hover {
        border-color: rgba(95, 215, 255, 0.55);
      }

      .lobby__room--selected {
        border-color: #5fd7ff;
        background: rgba(95, 215, 255, 0.12);
      }

      .lobby__room--full {
        opacity: 0.5;
      }

      .lobby__room-name {
        font-weight: 700;
      }

      .lobby__room-players {
        text-align: right;
        color: #8fe9ff;
      }

      .lobby__room-meta,
      .lobby__room-params {
        color: rgba(190, 215, 255, 0.6);
        font-size: 12px;
      }

      .lobby__room-params {
        text-align: right;
      }

      .lobby__status {
        margin: 0 0 8px;
        color: rgba(190, 215, 255, 0.55);
        font-size: 12px;
      }

      .lobby__error {
        margin: 0 0 10px;
        padding: 8px 10px;
        border-radius: 8px;
        background: rgba(255, 107, 90, 0.14);
        color: #ffb3a8;
        font-size: 12px;
      }

      .lobby__actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }

      .lobby__button {
        padding: 10px 22px;
        border: 0;
        border-radius: 8px;
        background: #5fd7ff;
        color: #05121f;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .lobby__button--secondary {
        background: rgba(190, 215, 255, 0.16);
        color: #dbe9ff;
      }

      .lobby__mode {
        margin: 0 0 14px;
        text-align: center;
        color: rgba(143, 233, 255, 0.75);
        font-size: 12px;
      }

      .lobby__create {
        display: flex;
        gap: 8px;
        margin: 0 0 12px;
      }

      .lobby__create[hidden],
      .lobby__panel[hidden],
      .lobby__browse[hidden] {
        display: none;
      }

      .lobby__create .lobby__input {
        margin-top: 0;
      }

      .lobby__room-title {
        margin: 0 0 4px;
        font-size: 20px;
      }

      .lobby__columns {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 14px;
        margin: 8px 0 14px;
      }

      .lobby__heading {
        margin: 0 0 6px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(190, 215, 255, 0.65);
      }

      .lobby__roster,
      .lobby__chat {
        margin: 0;
        padding: 8px;
        height: 200px;
        overflow-y: auto;
        list-style: none;
        border: 1px solid rgba(190, 215, 255, 0.2);
        border-radius: 8px;
        background: rgba(5, 12, 22, 0.7);
      }

      .lobby__player {
        padding: 2px 0;
      }

      .lobby__player--me {
        color: #8fe9ff;
        font-weight: 700;
      }

      .lobby__chat-line {
        padding: 2px 0;
        overflow-wrap: anywhere;
      }

      .lobby__chat-line--system {
        color: rgba(190, 215, 255, 0.5);
        font-size: 12px;
      }

      .lobby__chat-author {
        color: #8fe9ff;
      }

      .lobby__chat-form {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }

      .lobby__chat-form .lobby__input {
        margin-top: 0;
      }

      .lobby__button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* Netgraph overlay (Tab / F3) */
      .netgraph {
        pointer-events: auto;
        position: fixed;
        top: 12px;
        right: 12px;
        width: 284px;
        padding: 12px;
        border: 1px solid rgba(95, 215, 255, 0.4);
        border-radius: 10px;
        background: rgba(6, 12, 24, 0.88);
        color: #dbe9ff;
        font:
          12px ui-monospace,
          Menlo,
          Consolas,
          monospace;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45);
      }

      .netgraph[hidden] {
        display: none;
      }

      .netgraph__header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .netgraph__title {
        letter-spacing: 0.06em;
        color: #8fe9ff;
      }

      .netgraph__codec {
        padding: 3px 8px;
        border: 1px solid rgba(95, 215, 255, 0.55);
        border-radius: 6px;
        background: rgba(95, 215, 255, 0.14);
        color: #dff6ff;
        font: inherit;
        cursor: pointer;
      }

      .netgraph__codec:disabled {
        opacity: 0.45;
        cursor: default;
      }

      .netgraph__canvas {
        display: block;
        width: 100%;
        height: 68px;
        border: 1px solid rgba(190, 215, 255, 0.18);
        border-radius: 6px;
        margin-bottom: 8px;
      }

      .netgraph__metrics {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 3px 10px;
        margin: 0 0 10px;
      }

      .netgraph__metrics dt {
        color: rgba(190, 215, 255, 0.65);
      }

      .netgraph__metrics dd {
        margin: 0;
        text-align: right;
        color: #f2f8ff;
      }

      .netgraph__controls {
        display: grid;
        gap: 6px;
        padding-top: 8px;
        border-top: 1px solid rgba(190, 215, 255, 0.16);
      }

      .netgraph__slider {
        display: grid;
        gap: 2px;
      }

      .netgraph__slider-head {
        display: flex;
        justify-content: space-between;
        color: rgba(190, 215, 255, 0.78);
      }

      .netgraph__value {
        color: #8fe9ff;
      }

      .netgraph__slider input[type='range'] {
        width: 100%;
        accent-color: #5fd7ff;
      }

      .netgraph__offline {
        margin: 0;
        color: rgba(190, 215, 255, 0.65);
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui-root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
